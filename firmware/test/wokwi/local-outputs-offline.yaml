name: 'Local sensor and outputs operate without MQTT delivery'
version: 1
author: 'fragile-freight-monitoring'

steps:
  - wait-serial: 'MPU6050 initialized'
  - wait-serial: 'Wi-Fi: starting connection attempt'
  - delay: 6000ms
  - set-control:
      part-id: imu
      control: accelX
      value: 0
  - set-control:
      part-id: imu
      control: accelY
      value: 0
  - set-control:
      part-id: imu
      control: accelZ
      value: 1
  - wait-serial: 'State=SAFE'
  - expect-pin:
      part-id: esp
      name: '25'
      value: 1
  - set-control:
      part-id: imu
      control: accelX
      value: 1.7
  - set-control:
      part-id: imu
      control: accelZ
      value: 1
  - wait-serial: 'State=DANGER'
  - expect-pin:
      part-id: esp
      name: '27'
      value: 1
  - delay: 250ms
  - set-control:
      part-id: imu
      control: accelX
      value: 0
  - wait-serial: 'State=SAFE'
  - expect-pin:
      part-id: esp
      name: '25'
      value: 1
