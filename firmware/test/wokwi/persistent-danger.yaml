name: 'Persistent DANGER does not repeat its alert waveform'
version: 1
author: 'fragile-freight-monitoring'

steps:
  - wait-serial: 'MPU6050 initialized'
  - set-control:
      part-id: imu
      control: accelZ
      value: 2
  - wait-serial: 'State=DANGER'
  - delay: 2500ms
  - expect-pin:
      part-id: esp
      name: '27'
      value: 1
