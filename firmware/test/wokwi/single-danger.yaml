name: 'One DANGER event produces one buzzer waveform'
version: 1
author: 'fragile-freight-monitoring'

steps:
  - wait-serial: 'MPU6050 initialized'
  - set-control:
      part-id: imu
      control: accelX
      value: 0
  - set-control:
      part-id: imu
      control: accelY
      value: 0
  - set-control:
      part-id: imu
      control: accelZ
      value: 1
  - wait-serial: 'State=SAFE'
  - set-control:
      part-id: imu
      control: accelZ
      value: 2
  - wait-serial: 'State=DANGER'
  - delay: 400ms
  - expect-pin:
      part-id: esp
      name: '27'
      value: 1
